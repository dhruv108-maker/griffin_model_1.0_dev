ethods: Point processing techniques like histogram equalization, contrast stretching. Spatial Filtering: Smoothing and sharpening filters. Frequency Domain Methods: Fourier transform, frequency domain filtering. Image Enhancement in Color Images: Techniques specific to color image processing. % 10"}, {"color": "#10B981", "font": {"color": "#F8FAFC"}, "id": "381", "label": "Unit 3: Image Restoration and Reconstruction", "mass": 6, "shape": "dot", "size": 30, "title": "\u003cb\u003eUNIT\u003c/b\u003e\u003cbr\u003eUnit 3: Image Restoration and Reconstruction"}, {"color": "#F59E0B", "font": {"color": "#F8FAFC"}, "id": "382", "label": "Image Degradation Models:...", "mass": 2, "shape": "dot", "size": 15, "title": "\u003cb\u003eTOPIC\u003c/b\u003e\u003cbr\u003eImage Degradation Models: Noise models, restoration using spatial and frequency domain methods. Wiener Filtering: Inverse filtering and least squares filtering. Image Reconstruction: Techniques for reconstruction from projections, applications in medical imaging. % 9"}, {"color": "#10B981", "font": {"color": "#F8FAFC"}, "id": "383", "label": "Unit 4: Image Compression", "mass": 6, "shape": "dot", "size": 30, "title": "\u003cb\u003eUNIT\u003c/b\u003e\u003cbr\u003eUnit 4: Image Compression"}, {"color": "#F59E0B", "font": {"color": "#F8FAFC"}, "id": "384", "label": "Redundancies and Compress...", "mass": 2, "shape": "dot", "size": 15, "title": "\u003cb\u003eTOPIC\u003c/b\u003e\u003cbr\u003eRedundancies and Compression Models: Lossy and lossless compression methods. Entropy Coding Techniques: Huffman coding, arithmetic coding. Transform Coding: JPEG and JPEG2000, wavelet- based coding. Video Compression: Standards like MPEG. % 9"}, {"color": "#10B981", "font": {"color": "#F8FAFC"}, "id": "385", "label": "Unit 5: Image Segmentation and Representation", "mass": 6, "shape": "dot", "size": 30, "title": "\u003cb\u003eUNIT\u003c/b\u003e\u003cbr\u003eUnit 5: Image Segmentation and Representation"}, {"color": "#F59E0B", "font": {"color": "#F8FAFC"}, "id": "386", "label": "Edge Detection: Gradient-...", "mass": 2, "shape": "dot", "size": 15, "title": "\u003cb\u003eTOPIC\u003c/b\u003e\u003cbr\u003eEdge Detection: Gradient-based, Laplacian-based methods. Region-Based Segmentation: Thresholding, region growing, and region splitting/merging. Morphological Processing: Dilation, erosion, opening, and closing operations. Object Representation and Description: Boundary descriptors, regional descriptors, and texture descriptors. % 10 List of Practical Weightage Contact hours"}, {"color": "#F59E0B", "font": {"color": "#F8FAFC"}, "id": "387", "label": "Write a program to read a...", "mass": 2, "shape": "dot", "size": 15, "title": "\u003cb\u003eTOPIC\u003c/b\u003e\u003cbr\u003eWrite a program to read an image from a file and display it using an image processing library (e.g., OpenCV or MATLAB). 10% 3"}, {"color": "#F59E0B", "font": {"color": "#F8FAFC"}, "id": "388", "label": "Implement histogram equal...", "mass": 2, "shape": "dot", "size": 15, "title": "\u003cb\u003eTOPIC\u003c/b\u003e\u003cbr\u003eImplement histogram equalization to improve the contrast of a given image. Compare the original and enhanced images. 10% 3"}, {"color": "#F59E0B", "font": {"color": "#F8FAFC"}, "id": "389", "label": "Apply a Gaussian filter t...", "mass": 2, "shape": "dot", "size": 15, "title": "\u003cb\u003eTOPIC\u003c/b\u003e\u003cbr\u003eApply a Gaussian filter to smooth a noisy image and then use a Laplacian filter to sharpen it. Display the results at each step. 10% 3"}, {"color": "#F59E0B", "font": {"color": "#F8FAFC"}, "id": "390", "label": "Compute the Fourier trans...", "mass": 2, "shape": "dot", "size": 15, "title": "\u003cb\u003eTOPIC\u003c/b\u003e\u003cbr\u003eCompute the Fourier transform of an image, apply a high-pass filter, and then perform the inverse Fourier transform to get the enhanced image. % 3 School of Science B.Sc. Data Science, Course Curriculum Academic Year, 2024-25 List of Practical Weightage Contact hours"}, {"color": "#F59E0B", "font": {"color": "#F8FAFC"}, "id": "391", "label": "Implement and compare mea...", "mass": 2, "shape": "dot", "size": 15, "title": "\u003cb\u003eTOPIC\u003c/b\u003e\u003cbr\u003eImplement and compare mean, median, and Wiener filters to remove noise from a given image. Analyze the effectiveness of each filter. % 3"}, {"color": "#F59E0B", "font": {"color": "#F8FAFC"}, "id": "392", "label": "Simulate image degradatio...", "mass": 2, "shape": "dot", "size": 15, "title": "\u003cb\u003eTOPIC\u003c/b\u003e\u003cbr\u003eSimulate image degradation using a known degradation function and Gaussian noise, then restore the image using inverse filtering and Wiener filtering. % 3"}, {"color": "#F59E0B", "font": {"color": "#F8FAFC"}, "id": "393", "label": "Implement Sobel, Prewitt,...", "mass": 2, "shape": "dot", "size": 15, "title": "\u003cb\u003eTOPIC\u003c/b\u003e\u003cbr\u003eImplement Sobel, Prewitt, and Canny edge detection algorithms. Compare the edges detected by each method on the same image. 10% 3"}, {"color": "#F59E0B", "font": {"color": "#F8FAFC"}, "id": "394", "label": "Implement dilation, erosi...", "mass": 2, "shape": "dot", "size": 15, "title": "\u003cb\u003eTOPIC\u003c/b\u003e\u003cbr\u003eImplement dilation, erosion, opening, and closing operations on a binary image. Show the effects of each operation. 10% 3"}, {"color": "#F59E0B", "font": {"color": "#F8FAFC"}, "id": "395", "label": "Implement region-based se...", "mass": 2, "shape": "dot", "size": 15, "title": "\u003cb\u003eTOPIC\u003c/b\u003e\u003cbr\u003eImplement region-based segmentation using region growing and threshold-based segmentation. Display the segmented images. 10% 3"}, {"color": "#F59E0B", "font": {"color": "#F8FAFC"}, "id": "396", "label": "Implement Huffman coding ...", "mass": 2, "shape": "dot", "size": 15, "title": "\u003cb\u003eTOPIC\u003c/b\u003e\u003cbr\u003eImplement Huffman coding for lossless compression and JPEG compression for lossy compression. Compare the original and compressed images in terms of size and quality. % 3 Instructional Method and Pedagogy: (Max. 100 words) The course will utilize a blend of instructional methods, including lectures, interactive discussions, and hands-on lab sessions. Lectures will cover theoretical foundations and algorithmic approaches, supplemented by real-world examples. Interactive discussions will facilitate deeper understanding and engagement. Lab sessions, using tools like MATLAB and Python with libraries such as OpenCV, will provide practical experience in implementing image processing techniques. Assessments will include quizzes, ass ignments, and project work to reinforce learning. Collaborative projects and case studies will encourage problem -solving and application of concepts to real -world scenarios, fostering both individual and team-based learning."}, {"color": "#10B981", "font": {"color": "#F8FAFC"}, "id": "397", "label": "Unit 1: Introduction:", "mass": 6, "shape": "dot", "size": 30, "title": "\u003cb\u003eUNIT\u003c/b\u003e\u003cbr\u003eUnit 1: Introduction:"}, {"color": "#F59E0B", "font": {"color": "#F8FAFC"}, "id": "398", "label": "Overview of AI and ML, Hi...", "mass": 2, "shape": "dot", "size": 15, "title": "\u003cb\u003eTOPIC\u003c/b\u003e\u003cbr\u003eOverview of AI and ML, Historical perspective, Types of Machine Learning: Supervised, Unsupervised, Reinforcement Learning, Applications of AI and ML in Data Science. % 7"}, {"color": "#10B981", "font": {"color": "#F8FAFC"}, "id": "399", "label": "Unit 2: Supervised Learning", "mass": 6, "shape": "dot", "size": 30, "title": "\u003cb\u003eUNIT\u003c/b\u003e\u003cbr\u003eUnit 2: Supervised Learning"}, {"color": "#F59E0B", "font": {"color": "#F8FAFC"}, "id": "400", "label": "Linear Regression, Logist...", "mass": 2, "shape": "dot", "size": 15, "title": "\u003cb\u003eTOPIC\u003c/b\u003e\u003cbr\u003eLinear Regression, Logistic Regression, Decision Trees and Random Forests, Support Vector Machines, Decision Bou
