<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    :root {
      --bg-dark: #0a0e17;
      --glass-bg: rgba(20, 28, 45, 0.75);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      
      --color-subject: #4285F4;
      --color-unit: #34A853;
      --color-topic: #FBBC05;
      --color-subtopic: #EA4335;
      --color-co: #9C27B0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); overflow: hidden; height: 100vh; width: 100vw; }

    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }

    /* Glassmorphism UI Components */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Top Floating Bar */
    #top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      z-index: 10;
    }

    #search-input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      padding: 8px 16px;
      border-radius: 8px;
      color: #fff;
      outline: none;
      width: 280px;
      transition: all 0.3s ease;
    }

    #search-input:focus {
      border-color: var(--color-subject);
      box-shadow: 0 0 10px rgba(66, 133, 244, 0.4);
    }

    /* Legend Overlay */
    #legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      padding: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .legend-item { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

    /* Side Metadata Panel */
    #side-panel {
      position: absolute;
      top: 80px;
      right: -400px;
      width: 360px;
      bottom: 20px;
      padding: 24px;
      z-index: 10;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    #side-panel.open { right: 20px; }

    .close-btn {
      align-self: flex-end;
      cursor: pointer;
      font-size: 1.2rem;
      color: var(--text-muted);
    }

    /* D3 SVG Graph Styles */
    .hull {
      fill-opacity: 0.12;
      stroke-opacity: 0.4;
      stroke-width: 2px;
      stroke-linejoin: round;
      transition: fill-opacity 0.3s, stroke-opacity 0.3s;
    }

    .hull:hover {
      fill-opacity: 0.25;
      stroke-opacity: 0.8;
    }

    .link {
      stroke: rgba(255, 255, 255, 0.15);
      stroke-width: 1.5px;
      fill: none;
      transition: stroke 0.3s, stroke-width 0.3s;
    }

    .link.highlighted {
      stroke: var(--color-subject);
      stroke-width: 3px;
      stroke-opacity: 0.9;
    }

    .node circle {
      stroke: #fff;
      stroke-width: 1.5px;
      cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
    }

    .node:hover circle {
      filter: drop-shadow(0 0 8px currentColor);
      transform: scale(1.2);
    }

    .node text {
      font-size: 11px;
      fill: var(--text-main);
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
  </style>
</head>

    // Parse Data Tree into Flat Nodes & Links
    const nodes = [];
    const links = [];
    const unitsMap = new Map();

    function flatten(node, parentId = null, depth = 0, parentType = null) {
      const id = String(node.id);
      const type = (node.type || 'DEFAULT').toUpperCase();
      const nodeObj = { id, text: node.text, type, depth, parentId, parentType };
      
      nodes.push(nodeObj);

      if (type === 'UNIT') {
        unitsMap.set(id, []);
      }
      
      if (parentId) {
        links.push({ source: parentId, target: id });
        
        // Populate Unit cluster maps
        if (parentType === 'UNIT' && unitsMap.has(parentId)) {
          unitsMap.get(parentId).push(nodeObj);
        }
      }

      if (node.children) {
        node.children.forEach(child => flatten(child, id, depth + 1, type));
      }
    }

    if (graphData.roots) {
      graphData.roots.forEach(root => flatten(root));
    }

    // Setup Canvas/SVG
    const width = window.innerWidth;
    const height = window.innerHeight;

    const svg = d3.select("#canvas-container").append("svg")
      .attr("width", width)
      .attr("height", height);

    const container = svg.append("g");

    // Zoom setup
    const zoom = d3.zoom()
      .scaleExtent([0.2, 5])
      .on("zoom", (event) => {
        container.attr("transform", event.transform);
        updateSemanticZoom(event.transform.k);
      });

    svg.call(zoom);

    // Color Mapping
    const colorScale = {
      SUBJECT: "#4285F4",
      UNIT: "#34A853",
      TOPIC: "#FBBC05",
      SUBTOPIC: "#EA4335",
      CO: "#9C27B0"
    };

    // D3 Force Simulation
    const simulation = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d => d.id).distance(d => d.target.type === 'TOPIC' ? 70 : 45))
      .force("charge", d3.forceManyBody().strength(d => d.type === 'SUBJECT' ? -1500 : -350))
      .force("center", d3.forceCenter(width / 2, height / 2))
      .force("collide", d3.forceCollide().radius(d => d.type === 'SUBJECT' ? 50 : 22));

    // Hull Generator for Bubble Clusters
    const hullGroup = container.append("g").attr("class", "hulls");

    // Draw Links
    const link = container.append("g")
      .selectAll("line")
      .data(links)
      .enter().append("line")
      .attr("class", "link");

    // Draw Nodes
    const node = container.append("g")
      .selectAll(".node")
      .data(nodes)
      .enter().append("g")
      .attr("class", "node")
      .call(d3.drag()
        .on("start", dragstarted)
        .on("drag", dragged)
        .on("end", dragended));

    node.append("circle")
      .attr("r", d => d.type === 'SUBJECT' ? 24 : d.type === 'UNIT' ? 16 : d.type === 'TOPIC' ? 10 : 6)
      .attr("fill", d => colorScale[d.type] || "#999");

    node.append("text")
      .attr("dx", 14)
      .attr("dy", 4)
      .text(d => d.text);

    // Semantic Zoom Rules
    function updateSemanticZoom(k) {
      node.selectAll("text").style("display", d => {
        if (d.type === 'SUBJECT' || d.type === 'UNIT') return "block";
        if (d.type === 'TOPIC' && k > 0.8) return "block";
        if ((d.type === 'SUBTOPIC' || d.type === 'CO') && k > 1.6) return "block";
        return "none";
      });
    }

    // Convex Hull for Unit Enclosures
    function drawHulls() {
      const hullData = [];
      unitsMap.forEach((children, unitId) => {
        const unitNode = nodes.find(n => n.id === unitId);
        if (!unitNode) return;
        const pts = [[unitNode.x, unitNode.y]];
        children.forEach(c => { if(c.x && c.y) pts.push([c.x, c.y]); });
        if (pts.length >= 3) {
          hullData.push({ id: unitId, path: d3.polygonHull(pts) });
        }
      });

      const hulls = hullGroup.selectAll("path").data(hullData, d => d.id);

      hulls.enter().append("path")
        .attr("class", "hull")
        .attr("fill", colorScale.UNIT)
        .attr("stroke", colorScale.UNIT)
        .merge(hulls)
        .attr("d", d => d.path ? "M" + d.path.join("L") + "Z" : null);

      hulls.exit().remove();
    }

    // Simulation Tick
    simulation.on("tick", () => {
      link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);

      node.attr("transform", d => `translate(${d.x},${d.y})`);

      drawHulls();
    });

    // Interactive Functions
    node.on("click", (event, d) => {
      event.stopPropagation();
      openPanel(d);
      highlightPath(d);
    });

    function openPanel(d) {
      const parentNode = nodes.find(n => n.id === d.parentId);
      document.getElementById("side-panel").classList.add("open");
      document.getElementById("panel-title").innerText = d.text;
      document.getElementById("panel-type").innerText = d.type;
      document.getElementById("panel-type").style.color = colorScale[d.type] || "#ffffff";
      document.getElementById("panel-body").innerHTML = `
        <strong>ID:</strong> ${d.id}<br/>
        <strong>Hierarchy Depth:</strong> Level ${d.depth}<br/>
        <strong>Parent Node:</strong> ${parentNode ? parentNode.text : 'Root'}
      `;
    }

    function closePanel() {
      document.getElementById("side-panel").classList.remove("open");
    }

    function highlightPath(d) {
      const activeIds = new Set();
      let curr = d;
      while (curr) {
        activeIds.add(curr.id);
        curr = nodes.find(n => n.id === curr.parentId);
      }
      link.classed("highlighted", l => activeIds.has(l.source.id) && activeIds.has(l.target.id));
    }

    function searchNodes(query) {
      if (!query.trim()) return;
      const target = nodes.find(n => n.text.toLowerCase().includes(query.toLowerCase()));
      if (target && target.x && target.y) {
        svg.transition().duration(750).call(
          zoom.transform,
          d3.zoomIdentity.translate(width / 2 - target.x * 1.5, height / 2 - target.y * 1.5).scale(1.5)
        );
        openPanel(target);
        highlightPath(target);
      }
    }

    function resetZoom() {
      svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity);
    }

    function dragstarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    }
    function dragged(event, d) {
      d.fx = event.x; d.fy = event.y;
    }
    function dragended(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    }
  </script>
</body>
</html>
